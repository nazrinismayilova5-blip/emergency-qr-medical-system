<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Add Patient</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: #f0f4f8;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      background: #ffffff;
      margin: 40px 0;
      padding: 30px 40px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 500px;
    }

    h1 {
      text-align: center;
      color: #ff69b4;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: 600;
      color: #333;
    }

    input, textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin-top: 5px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input:focus, textarea:focus {
      border-color: #1e90ff;
      outline: none;
    }

    button {
      margin-top: 20px;
      padding: 12px 18px;
      width: 100%;
      background: linear-gradient(90deg, #ff69b4, #1e90ff);
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.3s;
    }

    button:hover {
      opacity: 0.9;
    }

    a.back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #1e90ff;
      text-decoration: none;
      font-weight: 500;
    }

    .qr-section {
      text-align: center;
      background: #fef0f5;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      border: 1px solid #ffb6c1;
    }

    .qr-section h2 {
      color: #ff69b4;
      margin-bottom: 10px;
    }

    .qr-section img {
      max-width: 250px;
      margin: 10px 0;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .qr-section button {
      width: auto;
      padding: 8px 16px;
      border-radius: 8px;
      margin-top: 10px;
      background: #1e90ff;
    }

    @media print {
      body * {
        visibility: hidden !important;
      }
      .qr-only, .qr-only * {
        visibility: visible !important;
      }
      .qr-only {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        margin: 0 auto;
        text-align: center;
        padding-top: 20px;
      }
    }

  </style>
</head>
<body>
  <div class="container">
    <h1>Add new patient</h1>

    {% if qr_image %}
    <div class="qr-section">
      <h2>{{ name }} added </h2>
      <p>The generated QR code:</p>


      <div class="qr-only">
        <img src="{{ qr_image }}" alt="QR Code">
      </div>

      <br>
      <a href="{{ qr_url }}" target="_blank">Open patient info page</a>
      <br>
      <button onclick="window.print()">Print QR</button>
    </div>
    {% endif %}

    <form method="post">
      <label>Name</label>
      <input name="name" required>

      <label>Blood Type</label>
      <input name="blood">

      <label>Allergies</label>
      <input name="allergies">

      <label>Notes</label>
      <textarea name="notes"></textarea>

      <label>Emergency Contact Name</label>
      <input name="contact_name">

      <label>Emergency Contact Phone</label>
      <input name="contact_phone">

      <button type="submit">Save and Generate QR</button>
    </form>

    <a href="/" class="back-link">Back to list</a>
  </div>
</body>
</html>
